<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Projection works search request flow</title>
  <desc id="desc">Flow from GET works with q through SubmissionSearch id resolution, listing query, and response.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; }
      .box-hi { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }
      .box-ok { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #0f172a; }
      .sub { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #475569; }
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #0f172a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #334155; }
    </style>
  </defs>

  <text x="24" y="28" class="title">Projection path  request flow (default)</text>
  <text x="24" y="48" class="mono">WORKS_SEARCH_PROJECTION_DISABLED unset / not true|1|on</text>

  <rect x="220" y="68" width="320" height="48" rx="8" class="box"/>
  <text x="240" y="90" class="label">GET /v1/sites/:site/works?q=&</text>
  <text x="240" y="106" class="sub">q trimmed; length &lt; 3 dropped</text>

  <line x1="380" y1="116" x2="380" y2="148" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="200" y="148" width="360" height="44" rx="8" class="box"/>
  <text x="220" y="176" class="label">listPublishedWorks ’ dbListLatestPublishedSubmissions</text>

  <line x1="380" y1="192" x2="380" y2="224" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="160" y="224" width="440" height="64" rx="8" class="box-hi"/>
  <text x="180" y="248" class="label">dbSearchSubmissionIds (projection branch)</text>
  <text x="180" y="266" class="sub">SubmissionSearch WHERE site_id + status</text>
  <text x="180" y="282" class="sub">AND (search_tsv @@ websearch_to_tsquery OR q &lt;% search_text)</text>

  <line x1="380" y1="288" x2="380" y2="320" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="210" y="320" width="340" height="44" rx="8" class="box"/>
  <text x="230" y="348" class="label">DISTINCT submission_id[]  (+ subject intersect)</text>

  <line x1="380" y1="364" x2="380" y2="396" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="140" y="396" width="480" height="56" rx="8" class="box-ok"/>
  <text x="160" y="420" class="label">dbQuerySubmissions + count</text>
  <text x="160" y="438" class="sub">Browse total (no filters) can use dbCountListedFromProjection</text>

  <line x1="380" y1="452" x2="380" y2="484" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="260" y="484" width="240" height="28" rx="8" class="box"/>
  <text x="300" y="502" class="label">SiteWorkListingDTO</text>
</svg>
