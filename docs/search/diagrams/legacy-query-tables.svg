<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" role="img" aria-labelledby="title desc">
  <title id="title">Legacy ILIKE query and tables</title>
  <desc id="desc">UNION of WorkVersion ILIKE branches joined to SubmissionVersion and Submission.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; }
      .tbl { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }
      .branch { fill: #fffbeb; stroke: #b45309; stroke-width: 1.25; }
      .branch-opt { fill: #fdf4ff; stroke: #7e22ce; stroke-width: 1.25; stroke-dasharray: 4 3; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; fill: #0f172a; }
      .sub { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #475569; }
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #0f172a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #334155; }
      .caption { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #64748b; }
    </style>
  </defs>

  <text x="24" y="28" class="title">Legacy search SQL  tables and UNION branches</text>
  <text x="24" y="48" class="caption">pattern = '%' || q || '%' · each branch uses its own pg_trgm GIN index</text>

  <!-- Branches -->
  <text x="40" y="78" class="label">matching_wv = UNION</text>

  <rect x="40" y="92" width="200" height="44" rx="6" class="branch"/>
  <text x="52" y="110" class="label">A. WorkVersion.title</text>
  <text x="52" y="126" class="mono">ILIKE pattern</text>

  <rect x="260" y="92" width="200" height="44" rx="6" class="branch"/>
  <text x="272" y="110" class="label">B. WorkVersion.doi</text>
  <text x="272" y="126" class="mono">ILIKE pattern</text>

  <rect x="480" y="92" width="280" height="44" rx="6" class="branch"/>
  <text x="492" y="110" class="label">C. authors (text[])</text>
  <text x="492" y="126" class="mono">immutable_array_to_string(&) ILIKE</text>

  <rect x="40" y="152" width="320" height="44" rx="6" class="branch"/>
  <text x="52" y="170" class="label">D. Work.doi via WorkVersion È Work</text>
  <text x="52" y="186" class="mono">INNER JOIN "Work" w ON w.id = wv.work_id</text>

  <rect x="380" y="152" width="380" height="44" rx="6" class="branch-opt"/>
  <text x="392" y="170" class="label">E. affiliations (optional)</text>
  <text x="392" y="186" class="mono">work_version_affiliations_search_text(metadata) ILIKE</text>

  <text x="380" y="214" class="sub">E only if isAffiliationSearchEnabled(q)  significant non-stopword token</text>

  <!-- Arrow down -->
  <line x1="410" y1="210" x2="410" y2="250" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="250" y="250" width="320" height="40" rx="6" class="box"/>
  <text x="270" y="276" class="label">matching_wv.id  (WorkVersion ids, deduped by UNION)</text>

  <line x1="410" y1="290" x2="410" y2="330" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Join chain -->
  <rect x="80" y="330" width="240" height="70" rx="8" class="tbl"/>
  <text x="96" y="354" class="label">SubmissionVersion</text>
  <text x="96" y="372" class="mono">work_version_id = matching_wv.id</text>
  <text x="96" y="388" class="mono">AND status = $status</text>

  <line x1="320" y1="365" x2="380" y2="365" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="380" y="330" width="280" height="70" rx="8" class="tbl"/>
  <text x="396" y="354" class="label">Submission</text>
  <text x="396" y="372" class="mono">id = sv.submission_id</text>
  <text x="396" y="388" class="mono">AND site_id = $siteId</text>

  <line x1="410" y1="400" x2="410" y2="440" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="280" y="440" width="260" height="48" rx="8" class="box"/>
  <text x="300" y="462" class="label">SELECT DISTINCT s.id</text>
  <text x="300" y="478" class="sub">’ submission id[] for listing filter</text>

  <!-- Index callouts -->
  <text x="40" y="530" class="label">GIN indexes (pg_trgm)</text>
  <text x="40" y="550" class="mono">WorkVersion_title_trgm_idx · WorkVersion_doi_trgm_idx · WorkVersion_authors_trgm_idx</text>
  <text x="40" y="568" class="mono">Work_doi_trgm_idx · WorkVersion_affiliations_trgm_idx (partial, metadata IS NOT NULL)</text>
  <text x="40" y="592" class="caption">Site scoping happens only after the global WorkVersion probes  not in the ILIKE predicates.</text>
</svg>
