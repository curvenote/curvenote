# Fragment: secret S3/MinIO credentials for platform/scms/.app-config.secrets.development.yml
# Matches docker-compose MinIO (MINIO_ROOT_USER / MINIO_ROOT_PASSWORD).
# Applied by: bun run storage:use-minio
#
# On storage:use-gcp this block is removed so legacy storageSASecretKeyfile path wins.

api:
  storage:
    s3:
      accessKeyId: curvenote
      secretAccessKey: curvenote
