# yaml-language-server: $schema=./.app-config.schema.yml
name: Curvenote SCMS
auth:
  firebase:
    displayName: Curvenote
    actionTitle: Curvenote
    provisionNewUser: true
    allowLogin: true
  # google:
  #   displayName: Google
  #   clientId: 532105236354-p77l4in1rp32flscbljnm5abqrdsql1j.apps.googleusercontent.com
  #   redirectUrl: http://localhost:3031/auth/google/callback
  #   provisionNewUser: false
  #   allowLinking: true
  #   allowLogin: true
  # okta:
  #   displayName: Okta
  #   domain: https://dev-81450361.okta.com
  #   serverName: default
  #   clientId: 0oaiz9m2fqjCD6ZXL5d7
  #   redirectUrl: http://localhost:3031/auth/okta/callback
  #   provisionNewUser: true
  #   allowLogin: true
  #   allowLinking: true
  orcid:
    displayName: ORCID
    clientId: APP-YGB4O1FGGJXRK1IL
    redirectUrl: https://127.0.0.1/auth/orcid/callback
    orcidBaseUrl: https://orcid.org
    provisionNewUser: false
    allowLinking: true
    allowLogin: true
    adminLogin: false
  # Bluesky (AT Protocol OAuth). clientId must be a discoverable HTTPS URL on a public hostname (not localhost).
  # @atproto/oauth-client rejects: http://localhost in redirect_uris; https://localhost for client_id/jwks (loopback + https).
  # Use your Cloudflare tunnel host for all three — see packages/scms-server/src/modules/auth/bluesky/LOCAL_DEV.md
  # bluesky:
  #   displayName: Bluesky
  #   clientId: https://dev.curvenote.net/auth/bluesky/client-metadata
  #   redirectUrl: https://dev.curvenote.net/auth/bluesky/callback
  #   jwksUri: https://dev.curvenote.net/auth/bluesky/jwks
  #   provisionNewUser: false
  #   allowLinking: true
  #   allowLogin: true
  #   adminLogin: false
  #   # OAuth login hint: https PDS URL for Bluesky (bare bsky.social is not a valid handle — see README)
  #   pdsHostname: https://bsky.social
api:
  url: http://localhost:3031/v1
  # Workers in Docker cannot reach http://localhost on the host; use host.docker.internal.
  tasksCallbackUrl: http://host.docker.internal:3031/v1
  # editorApiUrl: http://localhost:8083
  editorApiUrl: https://api.curvenote.one
  previewIssuer: http://localhost:3031
  handshakeIssuer: http://localhost:3031
  userTokenAudience: http://localhost:3031/v1/login
  userTokenIssuer: http://localhost:3031/v1/tokens/user
  sessionTokenAudience: http://localhost:3031/v1
  sessionTokenIssuer: http://localhost:3031/v1/tokens/session
  tokenConfigUrl: http://localhost:3031/v1/config
  pubsubProjectId: curvenote-dev-1
  checkProjectId: curvenote-dev-1
  checkTopic: projects/curvenote-dev-1/topics/checks
  converterTopic: projects/curvenote-dev-1/topics/scmsTaskConverterTopic
  integrations:
    issuer: http://localhost:3031/v1/keys
    tokenExpiryDuration: 1m
    publicKey:
      kty: RSA
      n: iwCT21pGzBhtxb3Gn9poKEutic-nbcrMwAkTJJHSfiB94T4Ms-zTnGwuWOg-0g_Vb0xi7-rTppMCmeIVDhGvu3Tdz0UNsJVX21FPDGxhsnyKBgVILmB_UUh-bdEhY-VgaXSlKLUo_3JcW2wDLAwTJsx1Y32LuOsTC9DsRsSM6Ew1FLPnjjyFiCMXKKgOXsCS5k5nRrw1WniQJMTch2I28yqUfzLaRAZMMXIFxIUP8CGrSaYrU6dSWrfJu_W0CZqT_RFjSuWZ9VdpJpb_qT3f_zG8wq9Y2kTSUilaD_ver2AvBnxYT8CO8NtABu8cU82hOmUAfHJQS8GfX93fh71u9w
      e: AQAB
      use: sig
      alg: RS256
      kid: integration-key-2025-01
  knownBucketInfoMap:
    cdn:
      uri: cdn-curvenote-dev-1
      cdn: https://cdn.curvenote.dev
    pub:
      uri: cdn-pub-curvenote-dev-1
      cdn: https://pub.curvenote.dev
    prv:
      uri: cdn-private-curvenote-dev-1
      cdn: https://prv.curvenote.dev
    tmp:
      uri: cdn-tmp-curvenote-dev-1
      cdn: https://tmp.curvenote.dev
    hashstore:
      uri: hashstore-curvenote-dev-1
    staging:
      uri: staging-curvenote-dev-1
  privateSiteClaimSubject: curvenote.private.site
  submissionsServiceAccount:
    id: 018b9034-d660-7a20-9135-5794c1eb0bfb
  resend:
    fromEmail: Acme <onboarding@resend.dev>
  slack:
    disabled: true
app:
  adminUrl: http://localhost:3031
  editorUrl: http://localhost:8083
  renderServiceUrl: 'http://localhost:3000'
  # Work web-version preview theme (next-theme preview-theme; not submission previews)
  workVersionPreviewUrl: 'http://localhost:3810'
  # checks-relay (Bearer relayApiKey in .app-config.secrets.development.yml)
  checks:
    relayBaseUrl: http://localhost:4041
  branding:
    title: Curvenote SCMS
    showLoginLink: true
    poweredBy: true
    supportEmail: oapolicy@hhmi.org
  signin:
    mode: 'preferred'
    preferred: 'firebase'
    prompt: 'Sign in using your Google account'
    alternativePrompt: "Don't have a Google account?"
  signup:
    mode: 'preferred'
    preferred: 'firebase'
    prompt: 'Sign up with a Google account'
    alternativePrompt: 'See other ways to sign up'
    progressMessage: "You're almost ready to take advantage of the Curvenote Platform."
    approval:
      manual: false
      skipApproval: ['firebase'] # Firebase users get immediate access for testing
    steps:
      - type: 'link-providers'
        title: 'Connect your other accounts'
        providers: ['orcid']
        alternativePrompts:
          - provider: 'orcid'
            text: 'Linking your ORCID account will unlock additional application features'
          # - provider: 'bluesky'
          #   text: 'Linking your Bluesky account enables AT Protocol features where configured'
        skippable: true
      - type: 'data-collection'
        title: 'Confirm account details'
        fields: ['displayName', 'email']
      - type: 'agreement'
        title: 'Agree to Terms of Service'
        agreementUrls:
          - label: 'Terms of Service'
            url: 'https://example.com/terms'
          - label: 'Privacy Policy'
            url: 'https://example.com/privacy'
  statusBar:
    items:
      - name: 'plaform-support'
        type: 'request-help'
        position: 'left'
        properties:
          label: 'Get Help'
          prompt: 'Please describe what you need help with. Let us know what you were trying to achieve and what happened instead.'
          description: 'Sending this request will include your name and email address so we can respond to you.'
          successMessage: "Your request has been sent to the support team. We'll get back to you as soon as possible."
  extensions:
    sites:
      routes: true
      navigation: true
      video:
        title: 'Curvenote Sites'
        url: https://curvenote.com/videos/demo-1.mp4
        thumbnail: https://cdn.curvenote.com/static/welcome-video.png
      featured:
        title: 'Featured Sites'
        description: 'Explore selected site experiences and publishing destinations.'
        sites:
          - title: 'Community Showcase'
            url: https://curvenote.com
            thumbnail: https://cdn.curvenote.com/static/welcome-video.png
    pmc:
      task: true
      routes: true
      workflows: true
      navigation: true
      depositService:
        topic: projects/hhmi-staging-1/topics/pmcFtpTopic
        projectId: hhmi-staging-1
      inboundEmail:
        enabled: true
        username: curvenote
        senders:
          - steve@curvenote.com
          - franklin@curvenote.com
          - rowan@curvenote.com
          - hhmi-pmc-deposit@curvenote.com
          - /hhmi-pmc-deposit\+.*@curvenote\.com/ # will be interpreted as a regex
          - pmc-deposit@hhmi.org
      airtable:
        # HHMI
        baseId: appuBoDw7bAfzfyK4
        tables:
          pmcSubmissions:
            id: tblei5D9o7YMCJiAb # tblHnbpdbYLaVwIH1
            fields:
              nihmsId: fldj6ilQLjz1jq9hn # fldVBheGf5q3VLf5m
          scientists:
            id: tblKTlRedfiVcTo36
            viewId: viwmeQzAe5VRW0tiL
            fields:
              grantId: fldvUL6KgO08sR1da
              orcid: fldRrnnHqTrUS10cv
              fullName: fldGfKWEzaydmQt7O
              firstNamePreferred: fldn07q9nSQdHJzv1
              firstNamePrimary: flds2taPaXCUmNB3n
              lastNamePreferred: fld3MnNgCgzAhULc2
              email: fldiIBY4VDx70todG
    # hhmi-compliance:
    #   task: true
    #   routes: true
    #   navigation: true
    #   enhancedArticleRendering: false
    #   noticeToJournalsPdfUrl: https://workspace-cdn.hhmi.org/static/compliance/Notice-to-Journals-HHMI-Policy.pdf
    opensci-compliance:
      routes: true
      navigation: true
    checks-proofig:
      task: true
      checks: true
      routes: true
      apiBaseUrl: http://localhost:5173/Curvenote
      # apiBaseUrl: https://app100.proofig.com/ej
      submitMode: stream
      submitTopic: projects/curvenote-dev-1/topics/proofig-submit
      notifyBaseUrl: http://localhost:3031/v1/hooks/proofig/notify
      # notifyBaseUrl: https://dev.curvenote.net/v1/hooks/proofig/notify
      clientId: proofig-dev-1
      pdfService:
        topic: projects/curvenote-dev-1/topics/proofig-pdf-service
        devLocalPushUrl: http://localhost:8088/
      # clientId: Editorial-Manager@curvenote.com
    checks-text-integrity:
      task: true
      checks: true
      routes: true
      serviceName: ithenticate
      relayInstanceId: tii-sandbox
      notifyBaseUrl: http://localhost:3031/v1/hooks/text-integrity/notify
      autoRetry:
        enabled: true
        backoff:
          fixedIntervalSec: 60 # phase 1 spacing between auto-retries
          fixedRetryCount: 10
          stepBaseDelaySec: 300 # first delay after fixed phase
          multiplier: 2
          maxStepDelaySec: 43200 # 12 h cap per retry interval
        limits:
          maxRetryWindowSec: 259200 # 3 days from root failure
          maxAttempts: 20
        sweep:
          limit: 25
  dashboard:
    tasks:
      enabled: true
      builtins:
        - automated-checks
      sections:
        - title: 'Improve and publish your work'
          categories:
            - check
            - publish
        - title: 'Check HHMI Policy'
          categories:
            - 'hhmi policy'
    welcome:
      title: 'Welcome to the Curvenote SCMS'
      tagline: 'Share interactive research that connects your work to the bigger scientific story.'
      description: |-
        The **Curvenote SCMS** is designed to streamline your research process and help you move seamlessly from drafting to sharing and publishing your work.

        Use the tools in this dashboard to check manuscript integrity, ensure compliance with HHMI policy, and prepare your research outputs for submission or publication. Explore each section to discover interactive features, compliance checks, and guidance tailored to support your scientific journey.
      showTasks: true
      videos:
        - url: https://curvenote.com/videos/demo-1.mp4
          title: 'Curvenote SCMS Walkthrough'
  navigation:
    defaultRoute: settings
    items:
      - name: dashboard
        label: Home
        icon: house
        path: dashboard
        scopes:
          - app:dashboard:feature
      - name: works
        label: My Works
        icon: files
        path: works
        scopes:
          - app:works:feature
      - name: sites
        label: My Sites
        icon: site
        path: sites
        end: true
        scopes:
          - app:sites:feature
      - name: settings
        label: Settings
        icon: settings
        path: settings
        scopes:
          - app:settings:feature
      - name: pmc
        label: PMC Admin
        icon: pmc
        path: sites/pmc
        scopes:
          - site:read:pmc
      - name: platform
        label: Platform
        icon: platform
        path: platform
        scopes:
          - app:platform:admin
      - name: system
        label: System
        icon: zap
        path: system
        scopes:
          - system:admin
    helpItem:
      icon: help-circle
      properties:
        label: Report a Problem
        prompt: "Please describe the problem you're experiencing. Let us know what you were trying to achieve and what happened instead."
        description: 'Sending this request will include your name and email address so we can respond to you.'
        successMessage: "Your request has been sent to the support team. We'll get back to you as soon as possible."
  stringReplacements:
    work: 'thing'
