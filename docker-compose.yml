# Local Postgres for SCMS development (journals + journals_test).
# Start: npm run db:up   Stop: npm run db:down   Wipe data: npm run db:down:clean
services:
  postgres:
    image: postgres:16-alpine
    container_name: scms-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - scms_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  scms_postgres_data:
    name: scms_postgres_data
