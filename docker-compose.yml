# Local Postgres for SCMS development (journals + journals_test).
# Start: npm run db:up   Stop: npm run db:down   Wipe data: npm run db:down:clean
#
# `name` sets the Compose project name so Docker Desktop groups this stack as
# "scms-dev" instead of defaulting to the working-directory name ("dev").
name: scms-dev
services:
  postgres:
    # Custom image: postgres:16 + pgmq + pg_net + pg_cron (see docker/postgres/Dockerfile)
    # so local dev runs the same supabase queue stack as staging/prod.
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: scms-postgres:16-pgmq
    container_name: scms-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: curvenote
    # Lets pg_net (running inside the container) reach the dev server on the host
    # for push-to-drain wakes — works on Docker Desktop and Linux (host-gateway).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - scms_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgrest:
    # The SCMS Data API: the same engine as the Supabase Data API (PostgREST),
    # pinned to Supabase's current major version. Exposes the curated `api`
    # schema (see prisma/schema/migrations/20260711120000_add_data_api_schema).
    image: postgrest/postgrest:v13.0.4
    container_name: scms-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3010:3000'
    environment:
      PGRST_DB_URI: postgres://authenticator:curvenote@postgres:5432/journals
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: anon
      # Local-dev secret only (matches the Supabase CLI demo secret). Mint
      # matching service_role/anon JWTs with: node scripts/mint-dev-jwt.mjs
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters

volumes:
  scms_postgres_data:
    name: scms_postgres_data
