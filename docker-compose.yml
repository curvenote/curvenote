# Local Postgres + MinIO + task-converter for SCMS development.
# Start: bun run db:up   Stop: bun run db:down   Wipe data: bun run db:down:clean
# Postgres only (GCP storage opt-out): bun run db:up:gcp
#
# `name` sets the Compose project name so Docker Desktop groups this stack as
# "scms-dev" instead of defaulting to the working-directory name ("dev").
name: scms-dev
services:
  postgres:
    # Custom image: postgres:16 + pgmq + pg_net + pg_cron (see docker/postgres/Dockerfile)
    # so local dev runs the same supabase queue stack as staging/prod.
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: scms-postgres:16-pgmq
    container_name: scms-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: curvenote
    # Lets pg_net (running inside the container) reach the dev server on the host
    # for push-to-drain wakes — works on Docker Desktop and Linux (host-gateway).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - scms_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: scms-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: curvenote
      MINIO_ROOT_PASSWORD: curvenote
      # Browser PUTs from the SCMS app (and other local origins)
      MINIO_API_CORS_ALLOW_ORIGIN: '*'
      # Lets `mc ready local` healthcheck work without a prior alias set
      MC_HOST_local: http://curvenote:curvenote@127.0.0.1:9000
    volumes:
      - scms_minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: scms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./docker/minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ['/bin/sh', '/init-buckets.sh']
    restart: 'no'

  # Local converter worker. SCMS posts jobs to http://127.0.0.1:8080/ in development.
  # Image is built on first `bun run db:up` if missing (see scripts/ensure-task-converter-image.sh).
  # Rebuild explicitly: bun run db:rebuild:converter
  task-converter:
    image: task-converter-local
    container_name: scms-task-converter
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      PORT: '8080'
    # Callbacks to SCMS on the host (jobUrl / statusUrl use tasksCallbackUrl).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  scms_postgres_data:
    name: scms_postgres_data
  scms_minio_data:
    name: scms_minio_data
